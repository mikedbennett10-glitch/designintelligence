<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 108" font-family="sans-serif">
  <!-- Dev schematic floor plan, hand-built — AMB-ROOM-EX-001, Exam Room Typical 2-Door.
       Not production artwork (that's a consultant deliverable, WBS 3.4.1).
       Proves the WBS 3.5.1 SVG → room-data lookup engine: every
       data-taxonomy-id below matches a real room_equipment link for this
       room (see supabase/seed/003_example_room_content.sql). Furniture
       hotspots (provider stool, guest chair) were dropped when the
       placeholder SHR-FURN-* rows they pointed at were deleted (Oct 13) —
       the shapes stay as plain room furnishings, just non-interactive,
       until real formulary items are linked to this room. -->

  <rect x="2" y="2" width="140" height="104" rx="1" fill="#fafaf8" stroke="#44433f" stroke-width="2.5" />

  <!-- Provider door opening (left wall) + swing -->
  <rect x="1" y="20" width="4" height="30" fill="#fafaf8" />
  <path d="M 4 20 A 30 30 0 0 1 34 50" fill="none" stroke="#9a978f" stroke-width="0.75" stroke-dasharray="2,1.5" />
  <text x="6" y="16" font-size="4.5" fill="#6f6c66">Provider</text>

  <!-- Patient door opening (top wall) + swing -->
  <rect x="96" y="1" width="30" height="4" fill="#fafaf8" />
  <path d="M 96 4 A 30 30 0 0 1 126 34" fill="none" stroke="#9a978f" stroke-width="0.75" stroke-dasharray="2,1.5" />
  <text x="98" y="10" font-size="4.5" fill="#6f6c66">Patient</text>

  <!-- Hand-hygiene dispenser, wall-mounted near provider entry -->
  <g class="hotspot" data-taxonomy-id="SHR-EQUIP-HANDHYG-01" tabindex="0" role="button"
     aria-label="Hand Hygiene Dispenser, Wall-Mounted">
    <rect x="7" y="34" width="4" height="12" rx="1" fill="#e6f3f9" stroke="#005880" stroke-width="0.75" />
    <text x="12.5" y="41.5" font-size="4" fill="#1e1e1c">Hand hygiene</text>
  </g>

  <!-- Otoscope / Ophthalmoscope wall set, mounted on the far wall by the exam table -->
  <g class="hotspot" data-taxonomy-id="SHR-EQUIP-OTOSCOPE-01" tabindex="0" role="button"
     aria-label="Otoscope / Ophthalmoscope Wall Set">
    <rect x="133" y="38" width="4" height="14" rx="1" fill="#e6f3f9" stroke="#005880" stroke-width="0.75" />
    <text x="108" y="36" font-size="4" fill="#1e1e1c">Otoscope / ophth.</text>
  </g>

  <!-- Exam table, power -->
  <g class="hotspot" data-taxonomy-id="SHR-EQUIP-EXAMTABLE-01" tabindex="0" role="button"
     aria-label="Exam Table, Power">
    <rect x="68" y="42" width="52" height="24" rx="2" fill="#e6f3f9" stroke="#005880" stroke-width="0.9" />
    <text x="94" y="56" font-size="5" fill="#1e1e1c" text-anchor="middle">Exam Table</text>
  </g>

  <!-- Provider stool (not a hotspot — no furniture item linked to this room yet) -->
  <g>
    <circle cx="60" cy="75" r="8" fill="#f0efed" stroke="#a5a199" stroke-width="0.9" />
    <text x="60" y="88" font-size="4" fill="#6f6c66" text-anchor="middle">Stool</text>
  </g>

  <!-- Exam Room Guest Chair (not a hotspot — no furniture item linked to this room yet) -->
  <g>
    <rect x="98" y="78" width="22" height="20" rx="3" fill="#f0efed" stroke="#a5a199" stroke-width="0.9" />
    <text x="109" y="90" font-size="4" fill="#6f6c66" text-anchor="middle">Guest</text>
    <text x="109" y="94.5" font-size="4" fill="#6f6c66" text-anchor="middle">chair</text>
  </g>

  <text x="4" y="102" font-size="3.5" fill="#a5a199">dev schematic — not production artwork</text>
</svg>
